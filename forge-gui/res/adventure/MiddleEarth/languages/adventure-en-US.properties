# Middle-earth overrides for adventure texts that live in shared (common) files.
# The game loads <plane>/languages/adventure-<language>.properties as the "adventure bundle"; a key found here
# replaces the dialog text of any dialog node with that loctext/locname key (MapDialog -> Localizer).
# Values are java.text.MessageFormat patterns: write '{' and '}' for literal braces and '' for an apostrophe.
# Keep this file ASCII.

# --- Intro: the old wizard in the start hollow (common/maps/map/main_story/spawn.tmx, object 69)
adv.main_story_spawn.69.d.n0.text=Well met, '{'var=player_name'}'. You slept a long while under this hill.
adv.main_story_spawn.69.d.n2.name=Where am I? Why am I here?
adv.main_story_spawn.69.d.n1.text=You are in the Shire, a quiet green country of hobbits in the west of Middle-earth. Quiet for now: the Shadow in the East grows longer every year.
adv.main_story_spawn.69.d.n3.text=Old powers are stirring. Orcs gather in the Misty Mountains, the Nine ride again, and the Dark Lord seeks what was lost. Every sword and every spell will be needed before the end.
adv.main_story_spawn.69.d.n5.text=Walk the roads, find friends and lore, and grow strong. Bree, Rivendell, Rohan and Gondor will all have need of you before long.
adv.main_story_spawn.69.d.n7.text=Take this rune. It will always bring you back to this hollow. Go carefully, '{'var=player_name'}'.
adv.main_story_spawn.69.d.n9.text=One more thing, '{'var=player_name'}'. Take these coins, but do not spend them with merchants.
adv.main_story_spawn.69.d.n12.name=What are they, then? What are they for?
adv.main_story_spawn.69.d.n11.text=Challenge coins. Wherever folk gather in Middle-earth there are contests of skill and wit. Show a coin and you will be let in, and the prizes are well worth the trouble.
adv.main_story_spawn.69.d.n14.name=Where are these contests?
adv.main_story_spawn.69.d.n13.text=Ask the innkeepers. If a contest is held in town, the innkeeper will know of it.
adv.main_story_spawn.69.d.n16.name=Thank you.
adv.main_story_spawn.69.d.n15.text=Now go. The way out of the hollow is open. Hobbiton lies close by, and from there the East Road runs to Bree and on to Rivendell.
adv.main_story_spawn.69.d.n19.name=Thank you.
adv.main_story_spawn.69.d.n18.text=Now go. The way out of the hollow is open. Hobbiton lies close by, and from there the East Road runs to Bree and on to Rivendell.
adv.main_story_spawn.69.d.n21.name=Farewell.
adv.main_story_spawn.69.d.n22.text="'{'var=player_name'}'! The Shadow is not yet defeated. Keep up your strength, and your courage."
adv.main_story_spawn.69.d.n23.name="Farewell."
adv.main_story_spawn.69.d.n24.text="Good to see you again, '{'var=player_name'}'. I take it you have had some success on the road?"
adv.main_story_spawn.69.d.n26.name="I have fought the servants of the Enemy, but there is no end to them."
adv.main_story_spawn.69.d.n25.text="No, there is not. But each one you defeat weakens his hold on these lands."
adv.main_story_spawn.69.d.n28.name="What now?"
adv.main_story_spawn.69.d.n27.text="Now the hidden places of the world will open to you: places the Shadow has kept from the eyes of free folk."
adv.main_story_spawn.69.d.n29.text="Seek them out, but go carefully. Not all that is hidden wishes to be found."
adv.main_story_spawn.69.d.n31.text=[RED]Developer''s note:[] This is the end of the story content for now. The Middle-earth story is still being written.
adv.main_story_spawn.69.d.n33.text=[RED]Developer''s note:[] Check back with this NPC in a later version to continue the story.

